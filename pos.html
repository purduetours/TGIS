<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Merch POS | Purdue</title>
<link rel="icon" href="tgisicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Purdue brand palette */
  :root {
    --gold: #CFB991;        /* Boilermaker Gold */
    --gold-dark: #8E6F3E;   /* Aged */
    --gold-light: #EBD99F;  /* Dust */
    --rush: #DAAA00;        /* Rush */
    --black: #000000;
    --ink: #1A1A1A;
    --steel: #555960;
    --cool-gray: #6F727B;
    --railway: #9D9795;
    --paper: #F6F3EC;
    --white: #FFFFFF;
    --danger: #B3261E;

    --display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
    --body: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  .display { font-family: var(--display); font-stretch: 75%; text-transform: uppercase; letter-spacing: .02em; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100dvh; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 20px; background: var(--white);
    border-bottom: 6px solid var(--gold);
  }
  .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand img { height: 40px; width: auto; display: block; flex-shrink: 0; }
  .brand .divider { width: 2px; align-self: stretch; background: var(--gold); }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--black); white-space: nowrap; }
  .header-actions { display: flex; gap: 8px; }
  .ghost-btn {
    background: transparent; color: var(--black); border: 2px solid var(--black);
    padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px;
  }
  .ghost-btn:active { background: var(--gold-light); }

  main { display: grid; grid-template-columns: 1fr minmax(340px, 420px); min-height: 0; }

  /* ---------- Item grid ---------- */
  .items-wrap { overflow-y: auto; padding: 20px; }
  .items {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
  .item-btn {
    position: relative; min-height: 140px; padding: 18px 16px 16px;
    background: var(--white); color: var(--black);
    border-radius: var(--radius);
    border: 2px solid #E4DCCB; border-bottom: 6px solid var(--gold);
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    text-align: left; box-shadow: 0 2px 0 rgba(0,0,0,.04);
    transition: transform .06s ease, background .12s ease;
  }
  .item-btn:active { transform: scale(.97); background: var(--gold-light); }
  .item-btn .name { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; }
  .item-btn .price { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--gold-dark); }
  .item-btn .count {
    position: absolute; top: 10px; right: 10px; min-width: 34px; height: 34px; padding: 0 8px;
    border-radius: 17px; background: var(--black); color: var(--gold);
    font-family: var(--display); font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .item-btn.custom { background: transparent; border-style: dashed; border-color: var(--railway); border-bottom: 2px dashed var(--railway); justify-content: center; align-items: center; text-align: center; }
  .item-btn.custom .name { color: var(--steel); font-size: 20px; }
  .item-btn.custom .plus { font-size: 40px; line-height: 1; color: var(--steel); font-weight: 300; }
  .empty-items { color: var(--steel); font-size: 18px; padding: 40px 0; text-align: center; }

  /* ---------- Sale panel ---------- */
  .sale { background: var(--black); color: var(--white); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .sale-head { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid #2a2a2a; }
  .sale-head h2 { margin: 0; font-size: 24px; font-weight: 800; color: var(--gold); }
  .sale-head .clear { background: none; color: var(--railway); font-size: 15px; font-weight: 600; padding: 6px 4px; }
  .sale-head .clear:disabled { opacity: .35; cursor: default; }

  .lines { overflow-y: auto; padding: 6px 12px; }
  .empty-sale { color: var(--railway); text-align: center; padding: 48px 20px; font-size: 18px; }
  .empty-sale .big { font-family: var(--display); font-stretch: 75%; text-transform: uppercase; font-weight: 800; font-size: 30px; color: #3a3a3a; display: block; margin-bottom: 6px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 8px; border-bottom: 1px solid #222; }
  .line .l-name { font-weight: 700; font-size: 19px; }
  .line .l-total { font-family: var(--display); font-weight: 700; font-size: 20px; text-align: right; }
  .line .l-unit { color: var(--railway); font-size: 15px; align-self: center; }
  .line .controls { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .qty-btn {
    width: 44px; height: 44px; border-radius: 10px; background: #1f1f1f; color: var(--white);
    font-size: 26px; font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:active { background: #333; }
  .qty { min-width: 32px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22px; }
  .remove-btn { height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #E58C86; border: 1px solid #4a2321; font-weight: 700; font-size: 14px; margin-left: 4px; }
  .remove-btn:active { background: #2a1210; }

  .sale-foot { padding: 14px 20px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .summary .label { color: var(--railway); font-size: 16px; }
  .summary .amount { font-family: var(--display); font-weight: 900; font-size: 46px; color: var(--white); line-height: 1; }
  .total-btn {
    width: 100%; height: 76px; border-radius: var(--radius);
    background: var(--gold); color: var(--black);
    font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 30px; text-transform: uppercase; letter-spacing: .03em;
  }
  .total-btn:active { background: var(--rush); }
  .total-btn:disabled { background: #2a2a2a; color: #555; cursor: default; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay.open { display: flex; }
  .dialog { background: var(--white); border-radius: 18px; width: 100%; max-width: 520px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden; border-top: 8px solid var(--gold); }
  .dialog-head { padding: 18px 22px 8px; }
  .dialog-head h3 { margin: 0; font-size: 28px; font-weight: 800; }
  .dialog-head p { margin: 4px 0 0; color: var(--steel); }
  .dialog-body { padding: 8px 22px; overflow-y: auto; }
  .dialog-foot { padding: 14px 22px 20px; display: flex; gap: 10px; }
  .btn { flex: 1; height: 58px; border-radius: 12px; font-weight: 800; font-size: 18px; }
  .btn.primary { background: var(--black); color: var(--gold); }
  .btn.primary:active { background: #222; }
  .btn.gold { background: var(--gold); color: var(--black); }
  .btn.gold:active { background: var(--rush); }
  .btn.secondary { background: #EFEBE2; color: var(--black); }
  .btn.secondary:active { background: #E2DCCF; }

  /* Receipt */
  .receipt-dialog { max-width: 560px; }
  .receipt-total { text-align: center; padding: 10px 0 18px; border-bottom: 2px dashed #D9D2C2; }
  .receipt-total .label { font-size: 18px; color: var(--steel); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .receipt-total .amount { font-family: var(--display); font-weight: 900; font-size: 84px; line-height: 1; color: var(--black); }
  .receipt-total .meta { color: var(--steel); margin-top: 6px; }
  .receipt-lines { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 18px; }
  .receipt-lines td { padding: 9px 0; border-bottom: 1px solid #EEE8DC; }
  .receipt-lines td.q { width: 52px; font-family: var(--display); font-weight: 800; color: var(--gold-dark); }
  .receipt-lines td.u { color: var(--cool-gray); font-size: 15px; text-align: right; padding-right: 14px; white-space: nowrap; }
  .receipt-lines td.t { text-align: right; font-weight: 700; white-space: nowrap; }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-weight: 700; font-size: 15px; }
  .input {
    height: 52px; border: 2px solid #D9D2C2; border-radius: 10px; padding: 0 14px;
    font-family: var(--body); font-size: 18px; color: var(--ink); background: var(--white); width: 100%;
  }
  .input:focus { outline: none; border-color: var(--gold-dark); }
  .price-input { position: relative; }
  .price-input span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--steel); font-size: 18px; }
  .price-input .input { padding-left: 28px; }

  /* Item editor */
  .edit-row { display: grid; grid-template-columns: auto 1fr 120px auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #EEE8DC; }
  .edit-row .input { height: 46px; font-size: 17px; }
  .move { display: flex; flex-direction: column; gap: 2px; }
  .move button { width: 32px; height: 22px; background: #EFEBE2; border-radius: 6px; font-size: 12px; color: var(--steel); }
  .move button:disabled { opacity: .3; cursor: default; }
  .del { width: 46px; height: 46px; border-radius: 10px; background: #FBEAE9; color: var(--danger); font-size: 22px; font-weight: 700; }
  .add-row { width: 100%; height: 50px; margin: 12px 0 4px; border-radius: 10px; background: transparent; border: 2px dashed var(--railway); color: var(--steel); font-weight: 700; font-size: 16px; }
  .link-btn { background: none; color: var(--steel); text-decoration: underline; font-size: 15px; padding: 8px 0; }
  .error { color: var(--danger); font-weight: 600; min-height: 22px; margin: 4px 0 0; }

  /* ---------- Phone layout ---------- */
  .mobile-bar { display: none; }
  @media (max-width: 760px) {
    header { padding: 8px 16px; }
    .brand { gap: 10px; }
    .brand img { height: 26px; }
    .brand h1 { font-size: 18px; }
    .ghost-btn { padding: 6px 10px; font-size: 14px; white-space: nowrap; }
    main { grid-template-columns: 1fr; }
    .items-wrap { padding: 14px 16px 120px; }
    .items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .item-btn { min-height: 112px; padding: 14px 12px 12px; }
    .item-btn .name { font-size: 20px; }
    .item-btn .price { font-size: 19px; }
    .sale { position: fixed; inset: 0; z-index: 40; transform: translateY(100%); transition: transform .22s ease; }
    .sale.open { transform: translateY(0); }
    .sale-head .close-sale { display: inline-block; }
    .mobile-bar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--black);
      border-top: 4px solid var(--gold);
    }
    .mobile-bar .view { flex: 1; background: #1f1f1f; color: var(--white); border-radius: 12px; height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 14px; }
    .mobile-bar .view small { color: var(--railway); font-size: 13px; }
    .mobile-bar .view b { font-family: var(--display); font-size: 24px; font-weight: 900; }
    .mobile-bar .total-btn { width: auto; flex: 1; height: 60px; font-size: 24px; }
    .edit-row { grid-template-columns: auto 1fr 96px auto; }
    .receipt-total .amount { font-size: 64px; }
  }
  .close-sale { display: none; background: none; color: var(--white); font-size: 15px; font-weight: 700; padding: 6px 0; margin-right: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img src="PU-H-Full-RGB.png" alt="Purdue University">
      <span class="divider" aria-hidden="true"></span>
      <h1 class="display">Merch Sales</h1>
    </div>
    <div class="header-actions">
      <button class="ghost-btn" id="editItemsBtn">Edit items</button>
    </div>
  </header>

  <main>
    <section class="items-wrap" aria-label="Items">
      <div class="items" id="items"></div>
    </section>

    <aside class="sale" id="salePanel" aria-label="Current sale">
      <div class="sale-head">
        <div style="display:flex;align-items:baseline">
          <button class="close-sale" id="closeSaleBtn">&larr; Items</button>
          <h2 class="display">Current Sale</h2>
        </div>
        <button class="clear" id="clearBtn">Clear sale</button>
      </div>
      <div class="lines" id="lines"></div>
      <div class="sale-foot">
        <div class="summary">
          <span class="label" id="itemCount">0 items</span>
          <span class="amount" id="saleTotal">$0.00</span>
        </div>
        <button class="total-btn" id="totalBtn">Total Sale</button>
      </div>
    </aside>
  </main>
</div>

<!-- Phone-only bottom bar -->
<div class="mobile-bar">
  <button class="view" id="openSaleBtn"><small id="mItemCount">0 items</small><b id="mTotal">$0.00</b></button>
  <button class="total-btn" id="mTotalBtn">Total</button>
</div>

<!-- Receipt / total -->
<div class="overlay" id="receiptOverlay" role="dialog" aria-modal="true" aria-labelledby="receiptTitle">
  <div class="dialog receipt-dialog">
    <div class="dialog-body">
      <div class="receipt-total">
        <div class="label" id="receiptTitle">Amount Due</div>
        <div class="amount" id="receiptAmount">$0.00</div>
        <div class="meta" id="receiptMeta"></div>
      </div>
      <table class="receipt-lines"><tbody id="receiptLines"></tbody></table>
    </div>
    <div class="dialog-foot">
      <button class="btn secondary" id="backToSaleBtn">Edit sale</button>
      <button class="btn primary" id="newSaleBtn">New sale</button>
    </div>
  </div>
</div>

<!-- Custom item -->
<div class="overlay" id="customOverlay" role="dialog" aria-modal="true" aria-labelledby="customTitle">
  <form class="dialog" id="customForm" autocomplete="off">
    <div class="dialog-head">
      <h3 class="display" id="customTitle">Custom Item</h3>
      <p>Add a one-off item to this sale only.</p>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label for="customName">Description</label>
        <input class="input" id="customName" placeholder="e.g. Donation">
      </div>
      <div class="field">
        <label for="customPrice">Price</label>
        <div class="price-input"><span>$</span><input class="input" id="customPrice" inputmode="decimal" placeholder="0.00"></div>
      </div>
      <p class="error" id="customError"></p>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn secondary" data-close>Cancel</button>
      <button type="submit" class="btn gold">Add to sale</button>
    </div>
  </form>
</div>

<!-- Item editor -->
<div class="overlay" id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="dialog">
    <div class="dialog-head">
      <h3 class="display" id="editTitle">Edit Items</h3>
      <p>Changes are saved on this device only.</p>
    </div>
    <div class="dialog-body">
      <div id="editRows"></div>
      <button class="add-row" id="addRowBtn">+ Add item</button>
      <button class="link-btn" id="resetItemsBtn">Reset to default items</button>
      <p class="error" id="editError"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn secondary" data-close>Cancel</button>
      <button class="btn primary" id="saveItemsBtn">Save items</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Default merchandise — edit this list to change what shows
   up on a fresh device. Prices are in dollars.
   ========================================================= */
const DEFAULT_ITEMS = [
  { name: 'T-Shirt',       price: 15 },
  { name: 'Hoodie',        price: 35 },
  { name: 'Crewneck',      price: 30 },
  { name: 'Hat',           price: 20 },
  { name: 'Water Bottle',  price: 18 },
  { name: 'Tote Bag',      price: 12 },
  { name: 'Sticker',       price: 3  },
  { name: 'Sticker Pack',  price: 8  },
];

const STORAGE_KEY = 'purdue-merch-pos-items-v1';

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const toCents = (dollars) => Math.round(Number(dollars) * 100);
const money = (cents) => (cents < 0 ? '-$' : '$') + (Math.abs(cents) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const parsePrice = (raw) => {
  const v = String(raw).replace(/[$,\s]/g, '');
  if (!/^\d*(\.\d{0,2})?$/.test(v) || v === '' || v === '.') return null;
  return toCents(v);
};

/* ---------- state ---------- */
let items = loadItems();   // [{id, name, cents}]
let sale = [];             // [{id (item id or custom id), name, cents, qty}]

function loadItems() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.every(i => typeof i.name === 'string' && Number.isInteger(i.cents))) {
      return saved.map(i => ({ id: i.id || uid(), name: i.name, cents: i.cents }));
    }
  } catch (e) { /* storage unavailable — fall back to defaults */ }
  return defaultItems();
}
function defaultItems() { return DEFAULT_ITEMS.map(i => ({ id: uid(), name: i.name, cents: toCents(i.price) })); }
function saveItems() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) { /* ignore */ }
}

/* ---------- sale actions ---------- */
function addToSale(id, name, cents) {
  const line = sale.find(l => l.id === id);
  if (line) line.qty++;
  else sale.push({ id, name, cents, qty: 1 });
  render();
}
function changeQty(id, delta) {
  const line = sale.find(l => l.id === id);
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) sale = sale.filter(l => l.id !== id);
  render();
}
function removeLine(id) { sale = sale.filter(l => l.id !== id); render(); }
function saleTotal() { return sale.reduce((s, l) => s + l.cents * l.qty, 0); }
function saleCount() { return sale.reduce((s, l) => s + l.qty, 0); }

/* ---------- rendering ---------- */
function renderItems() {
  const counts = Object.fromEntries(sale.map(l => [l.id, l.qty]));
  const grid = $('items');
  grid.innerHTML = items.map(i => `
    <button class="item-btn" data-id="${i.id}">
      ${counts[i.id] ? `<span class="count">${counts[i.id]}</span>` : ''}
      <span class="name">${escapeHtml(i.name)}</span>
      <span class="price">${money(i.cents)}</span>
    </button>`).join('') + `
    <button class="item-btn custom" id="customBtn">
      <span class="plus">+</span>
      <span class="name">Custom item</span>
    </button>`;
}

function renderSale() {
  const lines = $('lines');
  if (!sale.length) {
    lines.innerHTML = `<div class="empty-sale"><span class="big">No items yet</span>Tap an item to add it to the sale.</div>`;
  } else {
    lines.innerHTML = sale.map(l => `
      <div class="line">
        <div class="l-name">${escapeHtml(l.name)}</div>
        <div class="l-total">${money(l.cents * l.qty)}</div>
        <div class="l-unit">${money(l.cents)} each</div>
        <div class="controls">
          <button class="qty-btn" data-act="dec" data-id="${l.id}" aria-label="Remove one ${escapeHtml(l.name)}">&minus;</button>
          <span class="qty">${l.qty}</span>
          <button class="qty-btn" data-act="inc" data-id="${l.id}" aria-label="Add one ${escapeHtml(l.name)}">+</button>
          <button class="remove-btn" data-act="remove" data-id="${l.id}">Remove</button>
        </div>
      </div>`).join('');
  }
  const total = money(saleTotal());
  const count = saleCount();
  const countText = `${count} item${count === 1 ? '' : 's'}`;
  $('saleTotal').textContent = total;
  $('itemCount').textContent = countText;
  $('mTotal').textContent = total;
  $('mItemCount').textContent = countText;
  $('totalBtn').disabled = !sale.length;
  $('mTotalBtn').disabled = !sale.length;
  $('clearBtn').disabled = !sale.length;
}

function render() { renderItems(); renderSale(); }

/* ---------- overlays ---------- */
function openOverlay(id) { $(id).classList.add('open'); }
function closeOverlay(id) { $(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', (e) => {
    if (e.target === o || e.target.closest('[data-close]')) closeOverlay(o.id);
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o => closeOverlay(o.id));
});

/* Receipt */
function showTotal() {
  if (!sale.length) return;
  $('receiptAmount').textContent = money(saleTotal());
  const count = saleCount();
  $('receiptMeta').textContent = `${count} item${count === 1 ? '' : 's'}`;
  $('receiptLines').innerHTML = sale.map(l => `
    <tr>
      <td class="q">${l.qty}&times;</td>
      <td>${escapeHtml(l.name)}</td>
      <td class="u">${l.qty > 1 ? money(l.cents) + ' ea' : ''}</td>
      <td class="t">${money(l.cents * l.qty)}</td>
    </tr>`).join('');
  $('salePanel').classList.remove('open');
  openOverlay('receiptOverlay');
}
function newSale() {
  sale = [];
  closeOverlay('receiptOverlay');
  $('salePanel').classList.remove('open');
  render();
}

/* Custom item */
function openCustom() {
  $('customName').value = '';
  $('customPrice').value = '';
  $('customError').textContent = '';
  openOverlay('customOverlay');
  setTimeout(() => $('customName').focus(), 50);
}
$('customForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('customName').value.trim() || 'Custom item';
  const cents = parsePrice($('customPrice').value);
  if (cents === null || cents <= 0) { $('customError').textContent = 'Enter a valid price, like 5 or 12.50.'; return; }
  addToSale('custom-' + uid(), name, cents);
  closeOverlay('customOverlay');
});

/* Item editor */
let draft = [];   // [{id, name, price (string as typed)}]
const toDraft = (i) => ({ id: i.id, name: i.name, price: (i.cents / 100).toFixed(2) });
function openEditor() {
  draft = items.map(toDraft);
  $('editError').textContent = '';
  renderEditor();
  openOverlay('editOverlay');
}
function renderEditor() {
  $('editRows').innerHTML = draft.map((i, idx) => `
    <div class="edit-row" data-idx="${idx}">
      <div class="move">
        <button data-move="-1" ${idx === 0 ? 'disabled' : ''} aria-label="Move up">&#9650;</button>
        <button data-move="1" ${idx === draft.length - 1 ? 'disabled' : ''} aria-label="Move down">&#9660;</button>
      </div>
      <input class="input" data-field="name" value="${escapeHtml(i.name)}" placeholder="Item name" aria-label="Item name">
      <div class="price-input"><span>$</span><input class="input" data-field="price" inputmode="decimal" value="${escapeHtml(i.price)}" placeholder="0.00" aria-label="Price"></div>
      <button class="del" data-del aria-label="Delete item">&times;</button>
    </div>`).join('');
}
function syncDraftFromInputs() {
  document.querySelectorAll('#editRows .edit-row').forEach(row => {
    const d = draft[+row.dataset.idx];
    d.name = row.querySelector('[data-field=name]').value;
    d.price = row.querySelector('[data-field=price]').value;
  });
}
$('editRows').addEventListener('click', (e) => {
  const row = e.target.closest('.edit-row');
  if (!row) return;
  const idx = +row.dataset.idx;
  const mv = e.target.closest('[data-move]');
  if (mv) {
    syncDraftFromInputs();
    const to = idx + +mv.dataset.move;
    [draft[idx], draft[to]] = [draft[to], draft[idx]];
    renderEditor();
  } else if (e.target.closest('[data-del]')) {
    syncDraftFromInputs();
    draft.splice(idx, 1);
    renderEditor();
  }
});
$('addRowBtn').addEventListener('click', () => {
  syncDraftFromInputs();
  draft.push({ id: uid(), name: '', price: '' });
  renderEditor();
  const inputs = document.querySelectorAll('#editRows [data-field=name]');
  inputs[inputs.length - 1].focus();
});
$('resetItemsBtn').addEventListener('click', () => {
  if (!confirm('Replace your item list with the default items?')) return;
  draft = defaultItems().map(toDraft);
  renderEditor();
});
$('saveItemsBtn').addEventListener('click', () => {
  syncDraftFromInputs();
  const next = [];
  for (const d of draft) {
    const name = d.name.trim();
    const cents = parsePrice(d.price);
    if (!name && d.price.trim() === '') continue; // skip blank rows
    if (!name) { $('editError').textContent = 'Every item needs a name.'; return; }
    if (cents === null) { $('editError').textContent = `“${name}” needs a valid price.`; return; }
    next.push({ id: d.id, name, cents });
  }
  items = next;
  saveItems();
  // keep sale lines in sync with renamed / repriced items
  sale.forEach(l => { const it = items.find(i => i.id === l.id); if (it) { l.name = it.name; l.cents = it.cents; } });
  closeOverlay('editOverlay');
  render();
});

/* ---------- wiring ---------- */
$('items').addEventListener('click', (e) => {
  const btn = e.target.closest('.item-btn');
  if (!btn) return;
  if (btn.id === 'customBtn') return openCustom();
  const it = items.find(i => i.id === btn.dataset.id);
  if (it) addToSale(it.id, it.name, it.cents);
});
$('lines').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'inc') changeQty(id, 1);
  else if (b.dataset.act === 'dec') changeQty(id, -1);
  else removeLine(id);
});
$('clearBtn').addEventListener('click', () => {
  if (sale.length && confirm('Clear all items from this sale?')) { sale = []; render(); }
});
$('totalBtn').addEventListener('click', showTotal);
$('mTotalBtn').addEventListener('click', showTotal);
$('newSaleBtn').addEventListener('click', newSale);
$('backToSaleBtn').addEventListener('click', () => closeOverlay('receiptOverlay'));
$('editItemsBtn').addEventListener('click', openEditor);
$('openSaleBtn').addEventListener('click', () => $('salePanel').classList.add('open'));
$('closeSaleBtn').addEventListener('click', () => $('salePanel').classList.remove('open'));

render();
</script>
</body>
</html>
